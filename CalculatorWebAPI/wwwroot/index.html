<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Minha Calculadora Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Calculator WebAPI</h1>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    <div id="main-row">
        <div id="calc">
            <input type="text" id="display" readonly />

            <!-- unit buttons (3 lines, 4 columns) -->
            <div id="unit-buttons">
                <button class="btn unit" onclick="press('m')">m</button>
                <button class="btn unit" onclick="press('mm')">mm</button>
                <button class="btn unit" onclick="press('cm')">cm</button>
                <button class="btn unit" onclick="press('km')">km</button>
                <button class="btn unit" onclick="press('l')">l</button>
                <button class="btn unit" onclick="press('ml')">ml</button>
                <button class="btn unit" onclick="press('cl')">cl</button>
                <button class="btn unit" onclick="press('kl')">kl</button>
                <button class="btn unit" onclick="press('g')">g</button>
                <button class="btn unit" onclick="press('mg')">mg</button>
                <button class="btn unit" onclick="press('cg')">cg</button>
                <button class="btn unit" onclick="press('kg')">kg</button>
            </div>

            <!-- keyboard calculator -->
            <div id="buttons">
                <!-- first line -->
                <button class="btn" onclick="press('7')">7</button>
                <button class="btn" onclick="press('8')">8</button>
                <button class="btn" onclick="press('9')">9</button>
                <button class="btn" onclick="press('/')">/</button>

                <!-- Second line -->
                <button class="btn" onclick="press('4')">4</button>
                <button class="btn" onclick="press('5')">5</button>
                <button class="btn" onclick="press('6')">6</button>
                <button class="btn" onclick="press('*')">*</button>

                <!-- Third line -->
                <button class="btn" onclick="press('1')">1</button>
                <button class="btn" onclick="press('2')">2</button>
                <button class="btn" onclick="press('3')">3</button>
                <button class="btn" onclick="press('-')">-</button>

                <!-- fourth line -->
                <button class="btn" onclick="press('.')">.</button>
                <button class="btn" onclick="press('0')">0</button>
                <button class="btn" onclick="press('%')">%</button>
                <button class="btn" onclick="press('+')">+</button>

                <!-- fifth line: empty, [>x<], C, = -->
                <span></span>
                <button class="btn backspace-btn" style="grid-column: 2" onclick="backspace()">&gt;x&lt;</button>
                <button class="btn" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="calc()">=</button>
            </div>

        </div>
        <div id="history-panel">
            <h2>History</h2>
            <ul id="history-list"></ul>
            <button id="clear-history" onclick="clearHistory()">Clear History</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
